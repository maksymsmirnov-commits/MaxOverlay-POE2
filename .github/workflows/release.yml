# Builds MaxOverlay-POE2.exe and attaches it to a GitHub Release
# whenever a version tag (v*) is pushed. Releasing becomes:
#   git tag v1.1.0 && git push --tags
name: Build release exe

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-build.txt
      - run: pyinstaller --noconfirm --clean maxoverlay.spec
      # Release title = "MaxOverlay POE2 — <LEAGUE_TAG> v<VERSION>" (e.g. ROA v1.2.0),
      # read from the constants in maxoverlay.py.
      - id: meta
        shell: pwsh
        run: |
          $v = (Select-String -Path maxoverlay.py -Pattern 'VERSION = "(.+)"').Matches[0].Groups[1].Value
          $l = (Select-String -Path maxoverlay.py -Pattern 'LEAGUE_TAG = "(.+)"').Matches[0].Groups[1].Value
          "name=MaxOverlay POE2 - $l v$v" >> $env:GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.meta.outputs.name }}
          files: dist/MaxOverlay-POE2.exe
          generate_release_notes: true
